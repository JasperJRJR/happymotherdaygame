<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>測試模式 - 媽咪專屬 Block Blast ❤️</title>
    <style>
        :root {
            --bg-color: #fce4ec;
            --grid-bg: #f8bbd0;
            --cell-size: 40px;
            --primary-pink: #f06292;
            --selected-color: #ec407a;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        #header { margin-top: 15px; text-align: center; color: #ad1457; position: relative; width: 100%; }

        #score-container {
            font-size: 1.2rem;
            font-weight: bold;
            color: #d81b60;
            margin: 5px 0;
            background: rgba(255,255,255,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(8, var(--cell-size));
            grid-template-rows: repeat(8, var(--cell-size));
            gap: 2px;
            background-color: var(--grid-bg);
            padding: 5px;
            border-radius: 8px;
            margin-top: 5px;
        }

        .cell { width: var(--cell-size); height: var(--cell-size); background-color: #fff; border-radius: 4px; }
        .cell.filled { background-color: var(--primary-pink); }

        #pieces-container {
            margin-top: 20px; display: flex; gap: 15px; height: 120px;
            justify-content: center; align-items: center; min-width: 300px;
        }

        .piece {
            display: grid; gap: 2px; padding: 8px;
            border: 2px solid transparent; border-radius: 8px;
            cursor: pointer; background: rgba(255,255,255,0.4);
        }

        .piece.selected { border-color: var(--selected-color); background: white; transform: scale(1.1); }
        .piece-cell { width: 20px; height: 20px; border-radius: 3px; }
        .piece-cell.active { background-color: var(--primary-pink); }
        .piece-cell.empty { background-color: transparent; }

        .modal {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white; padding: 25px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center; z-index: 100;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 80%; max-width: 320px;
        }

        .modal.show { transform: translate(-50%, -50%) scale(1); }
        
        #heart-animation {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 100px; z-index: 200; pointer-events: none;
            transition: all 0.5s ease-out; opacity: 0;
        }

        #heart-animation.boom { transform: translate(-50%, -50%) scale(2.5); opacity: 1; }

        .particle {
            position: fixed; pointer-events: none; z-index: 150;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .close-btn { 
            margin-top: 15px; padding: 10px 20px; border-radius: 20px; border: none; 
            background: var(--primary-pink); color: white; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="header">
    <h3 style="margin: 0;">🛠️ 測試模式 (容易版)</h3>
    <div id="score-container">❤️ Score: <span id="score">0</span></div>
</div>

<div id="grid"></div>
<div id="pieces-container"></div>
<div id="heart-animation">❤️</div>

<div id="quote-modal" class="modal">
    <div id="surprise-icon" style="font-size: 2rem; margin-bottom: 10px;">✨</div>
    <div id="quote-text" style="color: #d81b60; font-size: 1.2rem; font-weight: bold;"></div>
    <button class="close-btn" onclick="toggleModal('quote-modal', false)">關閉測試</button>
</div>

<script>
    const GRID_SIZE = 8;
    let grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
    let selectedPiece = null;
    let currentShapes = [];
    let totalScore = 0;

    // 【修改重點】：測試專用的簡單方塊（包含豎長條）
    const TEST_SHAPES = [
        [[1]],             // 1x1 單點
        [[1], [1]],        // 2x1 豎長條
        [[1], [1], [1]],   // 3x1 豎長條
        [[1, 1]],          // 1x2 橫長條
        [[1, 1], [1, 1]]   // 2x2 方塊
    ];

    const quotes = ["測試：消除成功！❤️", "加油，快達成全消！"];
    const superQuotes = ["🏆 成功觸發：全清空獎勵 10000 分！", "愛心雨測試成功！💖"];

    function initGame() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r}-${c}`;
                cell.onclick = () => handleCellClick(r, c);
                gridEl.appendChild(cell);
            }
        }
        renderPieces();
    }

    function renderPieces() {
        const container = document.getElementById('pieces-container');
        container.innerHTML = '';
        currentShapes = [];
        for (let i = 0; i < 3; i++) {
            const shape = TEST_SHAPES[Math.floor(Math.random() * TEST_SHAPES.length)];
            currentShapes.push({ shape: shape, used: false });
            const pieceEl = document.createElement('div');
            pieceEl.className = 'piece';
            pieceEl.id = `piece-${i}`;
            pieceEl.style.gridTemplateColumns = `repeat(${shape[0].length}, 20px)`;
            pieceEl.onclick = (e) => {
                document.querySelectorAll('.piece').forEach(p => p.classList.remove('selected'));
                pieceEl.classList.add('selected');
                selectedPiece = { shape: shape, index: i };
                e.stopPropagation();
            };
            shape.forEach(row => {
                row.forEach(val => {
                    const c = document.createElement('div');
                    c.className = val ? 'piece-cell active' : 'piece-cell empty';
                    pieceEl.appendChild(c);
                });
            });
            container.appendChild(pieceEl);
        }
    }

    function handleCellClick(r, c) {
        if (!selectedPiece) return;
        if (canPlace(selectedPiece.shape, r, c)) {
            place(selectedPiece.shape, r, c);
            currentShapes[selectedPiece.index].used = true;
            document.getElementById(`piece-${selectedPiece.index}`).style.visibility = 'hidden';
            selectedPiece = null;
            checkLines();
            if (currentShapes.every(s => s.used)) renderPieces();
        }
    }

    function canPlace(shape, row, col) {
        if (row + shape.length > GRID_SIZE || col + shape[0].length > GRID_SIZE) return false;
        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                if (shape[r][c] && grid[row + r][col + c]) return false;
            }
        }
        return true;
    }

    function place(shape, row, col) {
        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                if (shape[r][c]) {
                    grid[row + r][col + c] = 1;
                    document.getElementById(`cell-${row + r}-${col + c}`).classList.add('filled');
                }
            }
        }
    }

    function checkLines() {
        let rows = [], cols = [];
        for (let i = 0; i < GRID_SIZE; i++) {
            if (grid[i].every(v => v === 1)) rows.push(i);
            let colFull = true;
            for(let r=0; r<GRID_SIZE; r++) if(!grid[r][i]) colFull = false;
            if (colFull) cols.push(i);
        }
        
        let totalLines = rows.length + cols.length;
        if (totalLines > 0) {
            let scoreAdd = 200 * Math.pow(2, totalLines - 1);
            updateScore(scoreAdd);
            rows.forEach(r => grid[r].fill(0));
            cols.forEach(c => grid.forEach(row => row[c] = 0));
            setTimeout(() => {
                updateUI();
                let isClearAll = grid.every(row => row.every(v => v === 0));
                if (isClearAll) {
                    updateScore(10000);
                    showBigSurprise();
                } else {
                    showSurprise();
                }
            }, 300);
        }
    }

    function updateScore(points) {
        totalScore += points;
        document.getElementById('score').innerText = totalScore;
    }

    function showSurprise() {
        const heart = document.getElementById('heart-animation');
        heart.classList.add('boom');
        setTimeout(() => {
            heart.classList.remove('boom');
            document.getElementById('surprise-icon').innerText = "✨";
            document.getElementById('quote-text').innerText = quotes[Math.floor(Math.random() * quotes.length)];
            toggleModal('quote-modal', true);
        }, 600);
    }

    function showBigSurprise() {
        for(let i=0; i<35; i++) createParticle();
        const heart = document.getElementById('heart-animation');
        heart.innerHTML = "💝";
        heart.classList.add('boom');
        setTimeout(() => {
            heart.classList.remove('boom');
            heart.innerHTML = "❤️";
            document.getElementById('surprise-icon').innerText = "👑 SUPER CLEAR! +10000";
            document.getElementById('quote-text').innerText = superQuotes[Math.floor(Math.random() * superQuotes.length)];
            toggleModal('quote-modal', true);
        }, 800);
    }

    function createParticle() {
        const p = document.createElement('div');
        p.className = 'particle';
        p.innerHTML = ['❤️','💖','🌸','✨'][Math.floor(Math.random()*4)];
        p.style.left = Math.random() * 100 + 'vw';
        p.style.top = '-20px';
        p.style.fontSize = (Math.random() * 20 + 20) + 'px';
        p.style.animationDuration = (Math.random() * 2 + 2) + 's';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 4000);
    }

    function updateUI() {
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const cell = document.getElementById(`cell-${r}-${c}`);
                grid[r][c] ? cell.classList.add('filled') : cell.classList.remove('filled');
            }
        }
    }

    function toggleModal(id, show) { document.getElementById(id).classList.toggle('show', show); }

    initGame();
</script>
</body>
</html>
