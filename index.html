<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>媽咪專屬 Block Blast ❤️</title>
    <style>
        :root {
            --bg-color: #fce4ec;
            --grid-bg: #f8bbd0;
            --cell-size: 40px;
            --primary-pink: #f06292;
            --selected-color: #ec407a;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        #header { margin-top: 15px; text-align: center; color: #ad1457; }

        #grid {
            display: grid;
            grid-template-columns: repeat(8, var(--cell-size));
            grid-template-rows: repeat(8, var(--cell-size));
            gap: 2px;
            background-color: var(--grid-bg);
            padding: 5px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: #fff;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .cell.filled { background-color: var(--primary-pink); }
        .cell.preview { background-color: #fce4ec; border: 1px dashed var(--primary-pink); }

        #pieces-container {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            height: 120px;
            justify-content: center;
            width: 100%;
        }

        .piece {
            display: grid;
            gap: 2px;
            padding: 5px;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
        }

        .piece.selected {
            border-color: var(--selected-color);
            background: white;
            transform: scale(1.1);
        }

        .piece-cell {
            width: 20px;
            height: 20px;
            background-color: var(--primary-pink);
            border-radius: 2px;
        }

        #quote-overlay {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            z-index: 100;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 80%;
        }

        #quote-overlay.show { transform: translate(-50%, -50%) scale(1); }
        #quote-text { color: #d81b60; font-size: 1.2rem; font-weight: bold; }
        
        button {
            margin-top: 15px; padding: 8px 20px;
            border-radius: 20px; border: none;
            background: var(--primary-pink); color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="header">
    <h3>母親節快樂 ❤️</h3>
    <p>玩法：先點下方方塊，再點格子放入</p>
</div>

<div id="grid"></div>

<div id="pieces-container"></div>

<div id="quote-overlay">
    <div style="font-size: 2rem;">💖</div>
    <div id="quote-text"></div>
    <button onclick="closeQuote()">繼續玩</button>
</div>

<script>
    const GRID_SIZE = 8;
    let grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
    let selectedPiece = null;
    let selectedPieceIndex = -1;

    const SHAPES = [
        { shape: [[1, 1], [1, 1]] }, // Square
        { shape: [[1, 1, 1, 1]] },    // Long I
        { shape: [[1, 1, 1]] },       // Short I
        { shape: [[1, 0], [1, 0], [1, 1]] }, // L
        { shape: [[0, 1], [0, 1], [1, 1]] }, // Reverse L
        { shape: [[1, 1], [0, 1], [0, 1]] }, // 7
        { shape: [[1, 1, 1], [0, 1, 0]] }    // T
    ];

    const quotes = [
        "媽咪，多謝妳咁多年嘅照顧！❤️",
        "妳係全家最重要嘅支柱！",
        "祝媽咪母親節快樂，日日都咁靚！",
        "有妳喺度，我先可以安心成長。",
        "雖然我唔喺身邊，但我心裡面好掛住妳！",
        "媽咪，消得好！我對妳嘅愛都爆燈咗！"
    ];

    function initGame() {
        const gridEl = document.getElementById('grid');
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => handleCellClick(r, c);
                cell.id = `cell-${r}-${c}`;
                gridEl.appendChild(cell);
            }
        }
        renderPieces();
    }

    function renderPieces() {
        const container = document.getElementById('pieces-container');
        container.innerHTML = '';
        for (let i = 0; i < 3; i++) {
            const shapeData = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            const pieceEl = document.createElement('div');
            pieceEl.className = 'piece';
            pieceEl.style.gridTemplateColumns = `repeat(${shapeData.shape[0].length}, 20px)`;
            pieceEl.onclick = (e) => {
                document.querySelectorAll('.piece').forEach(p => p.classList.remove('selected'));
                pieceEl.classList.add('selected');
                selectedPiece = shapeData.shape;
                selectedPieceIndex = i;
                e.stopPropagation();
            };

            shapeData.shape.forEach(row => {
                row.forEach(val => {
                    const c = document.createElement('div');
                    if (val) c.className = 'piece-cell';
                    pieceEl.appendChild(c);
                });
            });
            container.appendChild(pieceEl);
        }
    }

    function handleCellClick(r, c) {
        if (!selectedPiece) return;

        if (canPlace(selectedPiece, r, c)) {
            place(selectedPiece, r, c);
            const selectedEl = document.querySelector('.piece.selected');
            selectedEl.style.visibility = 'hidden';
            selectedEl.onclick = null;
            
            selectedPiece = null;
            checkLines();

            // 如果三個都放完了，刷新方塊
            const visiblePieces = Array.from(document.querySelectorAll('.piece')).filter(p => p.style.visibility !== 'hidden');
            if (visiblePieces.length === 0) renderPieces();
        }
    }

    function canPlace(shape, row, col) {
        if (row + shape.length > GRID_SIZE || col + shape[0].length > GRID_SIZE) return false;
        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                if (shape[r][c] && grid[row + r][col + c]) return false;
            }
        }
        return true;
    }

    function place(shape, row, col) {
        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                if (shape[r][c]) {
                    grid[row + r][col + c] = 1;
                    document.getElementById(`cell-${row + r}-${col + c}`).classList.add('filled');
                }
            }
        }
    }

    function checkLines() {
        let rowsToClear = [];
        let colsToClear = [];

        for (let r = 0; r < GRID_SIZE; r++) {
            if (grid[r].every(v => v === 1)) rowsToClear.push(r);
        }
        for (let c = 0; c < GRID_SIZE; c++) {
            if (grid.every(row => row[c] === 1)) colsToClear.push(c);
        }

        if (rowsToClear.length > 0 || colsToClear.length > 0) {
            rowsToClear.forEach(r => {
                for (let c = 0; c < GRID_SIZE; c++) grid[r][c] = 0;
            });
            colsToClear.forEach(c => {
                for (let r = 0; r < GRID_SIZE; r++) grid[r][c] = 0;
            });
            
            setTimeout(() => {
                updateGridUI();
                showQuote();
            }, 300);
        }
    }

    function updateGridUI() {
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const el = document.getElementById(`cell-${r}-${c}`);
                if (grid[r][c]) el.classList.add('filled');
                else el.classList.remove('filled');
            }
        }
    }

    function showQuote() {
        document.getElementById('quote-text').innerText = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-overlay').classList.add('show');
    }

    function closeQuote() {
        document.getElementById('quote-overlay').classList.remove('show');
    }

    initGame();
</script>
</body>
</html>
