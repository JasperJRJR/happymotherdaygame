<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>媽咪專屬 Block Blast ❤️</title>
    <style>
        :root {
            --bg-color: #fce4ec;
            --grid-bg: #f8bbd0;
            --cell-size: 40px;
            --primary-pink: #f06292;
            --selected-color: #ec407a;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            user-select: none;
        }

        #header { margin-top: 15px; text-align: center; color: #ad1457; }

        #grid {
            display: grid;
            grid-template-columns: repeat(8, var(--cell-size));
            grid-template-rows: repeat(8, var(--cell-size));
            gap: 2px;
            background-color: var(--grid-bg);
            padding: 5px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: #fff;
            border-radius: 4px;
        }

        .cell.filled { background-color: var(--primary-pink); }

        #pieces-container {
            margin-top: 25px;
            display: flex;
            gap: 20px;
            height: 120px;
            justify-content: center;
            align-items: center;
        }

        /* 核心修正：強制方塊保持比例 */
        .piece {
            display: grid;
            gap: 2px;
            padding: 8px;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(255,255,255,0.4);
        }

        .piece.selected {
            border-color: var(--selected-color);
            background: white;
            transform: scale(1.1);
        }

        .piece-cell {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }

        .piece-cell.active { background-color: var(--primary-pink); }
        .piece-cell.empty { background-color: transparent; }

        #quote-overlay {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            z-index: 100;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 80%;
        }

        #quote-overlay.show { transform: translate(-50%, -50%) scale(1); }
        #quote-text { color: #d81b60; font-size: 1.2rem; font-weight: bold; }
        button { margin-top: 15px; padding: 10px 20px; border-radius: 20px; border: none; background: var(--primary-pink); color: white; }
    </style>
</head>
<body>

<div id="header">
    <h3>母親節快樂 ❤️</h3>
    <p>選下方方塊，點格子放置</p>
</div>

<div id="grid"></div>
<div id="pieces-container"></div>

<div id="quote-overlay">
    <div style="font-size: 2.5rem;">💖</div>
    <div id="quote-text"></div>
    <button onclick="closeQuote()">繼續遊戲</button>
</div>

<script>
    const GRID_SIZE = 8;
    let grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
    let selectedPiece = null;

    const SHAPES = [
        [[1, 1], [1, 1]], // 田字
        [[1, 1, 1, 1]],   // 一字
        [[1, 1, 1]],      // 短一
        [[1, 0], [1, 0], [1, 1]], // L
        [[0, 1], [0, 1], [1, 1]], // 倒L
        [[1, 1, 1], [0, 1, 0]]    // T
    ];

    const quotes = [
        "媽咪，多謝妳一直咁錫我！❤️",
        "妳係全宇宙最正嘅媽咪！",
        "祝媽咪母親節快樂，日日開心！",
        "雖然唔喺澳門，但我心裡一直掛住妳！",
        "媽咪消得好勁！愛妳爆棚！"
    ];

    function initGame() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r}-${c}`;
                cell.onclick = () => handleCellClick(r, c);
                gridEl.appendChild(cell);
            }
        }
        renderPieces();
    }

    function renderPieces() {
        const container = document.getElementById('pieces-container');
        container.innerHTML = '';
        for (let i = 0; i < 3; i++) {
            const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            const pieceEl = document.createElement('div');
            pieceEl.className = 'piece';
            pieceEl.style.gridTemplateColumns = `repeat(${shape[0].length}, 20px)`;
            
            pieceEl.onclick = (e) => {
                document.querySelectorAll('.piece').forEach(p => p.classList.remove('selected'));
                pieceEl.classList.add('selected');
                selectedPiece = shape;
                e.stopPropagation();
            };

            shape.forEach(row => {
                row.forEach(val => {
                    const c = document.createElement('div');
                    c.className = val ? 'piece-cell active' : 'piece-cell empty';
                    pieceEl.appendChild(c);
                });
            });
            container.appendChild(pieceEl);
        }
    }

    function handleCellClick(r, c) {
        if (!selectedPiece) return;
        if (canPlace(selectedPiece, r, c)) {
            place(selectedPiece, r, c);
            const sel = document.querySelector('.piece.selected');
            sel.style.visibility = 'hidden';
            sel.classList.remove('selected');
            selectedPiece = null;
            checkLines();
            if (Array.from(document.querySelectorAll('.piece')).every(p => p.style.visibility === 'hidden')) {
                renderPieces();
            }
        }
    }

    function canPlace(shape, row, col) {
        if (row + shape.length > GRID_SIZE || col + shape[0].length > GRID_SIZE) return false;
        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                if (shape[r][c] && grid[row + r][col + c]) return false;
            }
        }
        return true;
    }

    function place(shape, row, col) {
        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                if (shape[r][c]) {
                    grid[row + r][col + c] = 1;
                    document.getElementById(`cell-${row + r}-${col + c}`).classList.add('filled');
                }
            }
        }
    }

    function checkLines() {
        let rows = [], cols = [];
        for (let i = 0; i < GRID_SIZE; i++) {
            if (grid[i].every(v => v === 1)) rows.push(i);
            if (grid.every(row => row[i] === 1)) cols.push(i);
        }
        if (rows.length || cols.length) {
            rows.forEach(r => grid[r].fill(0));
            cols.forEach(c => grid.forEach(row => row[c] = 0));
            setTimeout(() => {
                updateUI();
                showQuote();
            }, 300);
        }
    }

    function updateUI() {
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const cell = document.getElementById(`cell-${r}-${c}`);
                grid[r][c] ? cell.classList.add('filled') : cell.classList.remove('filled');
            }
        }
    }

    function showQuote() {
        document.getElementById('quote-text').innerText = quotes[Math.floor(Math.random() * quotes.length)];
        document.getElementById('quote-overlay').classList.add('show');
    }

    function closeQuote() { document.getElementById('quote-overlay').classList.remove('show'); }

    initGame();
</script>
</body>
</html>
